baseURL = 'https://www.zhangpengchao.com/'
locale = 'zh-CN'
title = '张鹏超的博客'

theme = 'hugo-theme-reimu'
defaultContentLanguage = 'zh-CN'

# mainSections - Hugo defaults to ["posts"] when unset; we just confirm

# 涓枃涓洪粯璁よ瑷€
[languages.zh-CN]
  title = '张鹏超的博客'

  label = '简体中文'
  locale = 'zh-CN'
  weight = 1
  hasCJKLanguage = true

# 鑻辨枃璇█
[languages.en]
  title = "ZhangPengchao's Blog"
  label = 'English'
  locale = 'en-US'
  weight = 2

[params]
  author = '张鹏超'
  keyword = ['博客', '浠ｇ爜', '鏃呰', '鎽勫奖', '婊戦洩', '张鹏超']
  description = '张鹏超 — 记录代码、旅行、摄影与一切在路上的人'
  since = 2026
  mainSections = ['posts', 'blog']

  # 鑷畾涔?CSS 娉ㄥ叆锛氭敞鍏ユ垜浠嚜宸辩殑鐐叿鏍峰紡
  custom_css = '/css/cyber.css'

  # 绀句氦閾炬帴
  [params.social]
    github = 'https://github.com/YiMeng-Zpc'
    email = 'Yi.Meng-@outlook.com'

  # 椤堕儴瀵艰埅鏍忥紙name 鐢ㄤ簬 i18n 缈昏瘧锛?
  [[params.nav]]
    name = 'home'
    path = '/'
    icon = 'fa-solid fa-house'
  [[params.nav]]
    name = 'archives'
    path = '/archives'
    icon = 'fa-solid fa-box-archive'
  [[params.nav]]
    name = 'tags'
    path = '/tags'
    icon = 'fa-solid fa-tags'
  [[params.nav]]
    name = 'categories'
    path = '/categories'
    icon = 'fa-solid fa-folder-open'
  [[params.nav]]
    name = 'about'
    path = '/about'
    icon = 'fa-solid fa-user-astronaut'

  # 渚ц竟鏍忚彍鍗曪紙name 鐢ㄤ簬 i18n锛寀rl 鐢ㄤ簬閾炬帴锛?
  # icon 鍐欐硶锛欶A6 class 鐩存帴娓叉煋锛屾瘮濡?'fa-solid fa-house'
  [[params.menu]]
    name = 'home'
    url = '/'
    icon = 'fa-solid fa-house'
  [[params.menu]]
    name = 'archives'
    url = '/archives'
    icon = 'fa-solid fa-box-archive'
  [[params.menu]]
    name = 'tags'
    url = '/tags'
    icon = 'fa-solid fa-tags'
  [[params.menu]]
    name = 'categories'
    url = '/categories'
    icon = 'fa-solid fa-folder-open'
  [[params.menu]]
    name = 'about'
    url = '/about'
    icon = 'fa-solid fa-user-astronaut'

  # 灏侀潰鍥鹃厤缃?鈥斺€?宸插叧闂紙浜屾鍏?banner 鐢ㄥ姩鎬?4K 椋庢櫙鍥炬浛浠ｏ紝瑙?header.html 娉ㄥ叆鐨?JS锛?
  [params.cover]
    image = false  # 鍏抽棴闈欐€?banner锛涙敼鐢?JS 娉ㄥ叆鐨勫姩鎬侀鏅浘浣滀负鍏ㄥ睆鑳屾櫙
    blur = true
    opacity = 0.6

  # 鍓爣棰橈紙棣栭〉鏍囬涓嬫柟灏忓瓧 鈥斺€?鏇夸唬"灏戝コ绁堢シ涓?.."锛?
  [params.subtitle]
    text = '代码 · 旅行 · 摄影 · 在路上'

  # 椤佃剼
  [params.footer]
    since = 2026
    author = '张鹏超'
    custom = 'Powered by Hugo · 走过的路都不会骗人 ✦ by ZhangPengchao'

  # 鎼滅储鍔熻兘
  [params.search]
    enable = true

  # 渚ц竟鏍忓皬缁勪欢
  [params.widget]
    enable = true
    description = '涓€涓儹鐖辨妧鏈€佽褰曠敓娲荤殑寮€鍙戣€?鉁?鍗氬銆佷唬鐮佷笌鏃ュ父鐨勬矇娣€銆?'

  # 涓婚閰嶈壊锛氭繁娴疯摑 + 鏆栨閲戯紙绉戞妧 / 鐢锋€у寲锛?
  [params.color]
    primary = '#0ea5e9'      # 娣辨捣钃?鈥?涓昏壊璋?'
    secondary = '#f59e0b'    # 鏆栨閲?鈥?寮鸿皟鑹?'
    background = '#0a0e1a'   # 濞ｅ崬顧侀拑婵嬬拨'
    accent = '#38bdf8'       # 濞村懏鎹ｉ拑?'
  # 鏆楄壊妯″紡
  [params.dark_mode]
    button = true
    mode = 'auto'

  # 鍚敤 AOS 鍔ㄦ晥
  [params.animation]
    enable = true
    options = { archive = { section = 'fade-up' } }

  # 鐗堟潈澹版槑
  # copyright = "漏 2026 蹇嗘ⅵ"


# Preloader (loader) loading text
[params.preloader.text]
  zh-CN = "加载中..."
  zh-TW = "加载中..."
  en = "Loading..."
