baseURL = 'https://www.zhangpengchao.com/'
locale = 'zh-CN'
title = '张鹏超'

theme = 'hugo-theme-reimu'
defaultContentLanguage = 'zh-CN'
# 隐藏 <meta name="generator" content="Hugo X.Y.Z"> 避免暴露版本号（L1 audit）
disableGenerator = true

# mainSections - Hugo defaults to ["posts"] when unset; we just confirm

# 中文为默认语言
[languages.zh-CN]
  title = '张鹏超'

  label = '简体中文'
  locale = 'zh-CN'
  weight = 1
  hasCJKLanguage = true

# 英文语言
[languages.en]
  title = "ZhangPengchao's Blog"
  label = 'English'
  locale = 'en-US'
  weight = 2

  # 英文站的站级文案覆盖（中文默认值见下方 [params]）
  [languages.en.params]
    author = 'Zhang Pengchao'
    keyword = ['blog', 'code', 'travel', 'photography', 'skiing', 'Zhang Pengchao']
    description = "Zhang Pengchao — documenting code, travel, photography, and everything on the road"
    copyright = '<span style="opacity:.75">The roads walked, the code written, the photos taken — footprints left by memories</span>'

    [languages.en.params.subtitle]
      text = 'Code · Travel · Photography · On the Road'

    [languages.en.params.widget]
      enable = true
      description = 'A developer who loves technology and documenting life ✦ thoughts on blog, code, and daily life.'

[languages.en.params.footer]
    since = 2026
    author = 'Zhang Pengchao'
    custom = 'Powered by Hugo · Every step counts ✦ by ZhangPengchao'
    powered = false
    busuanzi = false
    count = false

    [languages.en.params.uptime]
    start_date = '2021-08-03'
    display_date = 'November 11, 2025'

[params]
  author = '张鹏超'
  keywords = ['博客', '代码', '旅行', '摄影', '滑雪', '张鹏超']
  description = '张鹏超 — 记录代码、旅行、摄影与一切在路上的人'
  since = 2026

  # 计时器起始日期（支持完整 ISO 日期 'YYYY-MM-DD' 或仅年份 'YYYY'）
  # 用于 JS 解析 Date.UTC(年, 月-1, 日, 0, 0, 0) 计算已运行时间
  [params.uptime]
    start_date = '2021-08-03'   # 博客创立日
    display_date = '2025年11月11日'   # 显示在「始于 XXXX ✦」处的日期
  mainSections = ['posts', 'blog']

  # footer 个性化署名（覆盖 Reimu 主题的 'Hugo / Theme.Reimu' 署名）
  # copyright 是 Hugo Params.copyright，会被 Reimu footer.html 渲染到 footer 第一行
  copyright = '<span style="opacity:.75">走过的路、写过的码、拍过的照片 — 都是回忆留下的足迹</span>'

  # 自定义 CSS 注入：注入我们自己的炫酷样式
  custom_css = '/css/cyber.css'

  # 自定义霓虹光标（替换 Reimu 主题默认的卡通小女孩光标）
  [params.reimu_cursor]
    enable = true
    [params.reimu_cursor.cursor]
      default = '/images/cursor/cyber-cursor-default.svg'
      pointer = '/images/cursor/cyber-cursor-pointer.svg'
      text = '/images/cursor/cyber-cursor-text.svg'

  # 社交链接
  [params.social]
    github = 'https://github.com/YiMeng-Zpc'
    # 邮箱改为图标按钮入口（避免明文地址暴露），见 sidebar.html / footer.html 内的 Contact 图标

  # 顶部导航栏（name 用于 i18n 翻译）
  [[params.nav]]
    name = 'home'
    path = '/'
    icon = 'fa-solid fa-house'
  [[params.nav]]
    name = 'archives'
    path = '/archives'
    icon = 'fa-solid fa-box-archive'
  [[params.nav]]
    name = 'tags'
    path = '/tags'
    icon = 'fa-solid fa-tags'
  [[params.nav]]
    name = 'categories'
    path = '/categories'
    icon = 'fa-solid fa-folder-open'
  [[params.nav]]
    name = 'about'
    path = '/about'
    icon = 'fa-solid fa-user-astronaut'

  # 侧边栏菜单（name 用于 i18n，url 用于链接）
  # icon 写法：FA6 class 直接渲染，比如 'fa-solid fa-house'
  [[params.menu]]
    name = 'home'
    url = '/'
    icon = 'fa-solid fa-house'
  [[params.menu]]
    name = 'archives'
    url = '/archives'
    icon = 'fa-solid fa-box-archive'
  [[params.menu]]
    name = 'tags'
    url = '/tags'
    icon = 'fa-solid fa-tags'
  [[params.menu]]
    name = 'categories'
    url = '/categories'
    icon = 'fa-solid fa-folder-open'
  [[params.menu]]
    name = 'about'
    url = '/about'
    icon = 'fa-solid fa-user-astronaut'

  # 封面图配置 —— 已关闭（二次元 banner 用动态 4K 风景图替代，见 header.html 注入的 JS）
  [params.cover]
    image = false  # 关闭静态 banner；改用 JS 注入的动态风景图作为全屏背景
    blur = true
    opacity = 0.6

  # 副标题（首页标题下方小字 —— 替代 "少女祈祷中..."）
  [params.subtitle]
    text = '代码 · 旅行 · 摄影 · 在路上'

  # 页脚
  [params.footer]
    since = 2026
    author = '张鹏超'
    custom = 'Powered by Hugo · 走过的路都不会骗人 ✦ by ZhangPengchao'
    powered = false   # 关闭 Reimu 主题 '基于 Hugo Theme.Reimu' 署名
    busuanzi = false  # 关闭不蒜子访问量/访客量统计（默认 true）
    count = false     # 关闭 footer 内部计数

  # 搜索功能
  [params.search]
    enable = true

  # 侧边栏小部件
  [params.widget]
    enable = true
    description = '一个热爱技术、记录生活的开发者 ✦ 博客、代码与日常的沉淀。'

  # 主题配色：深海蓝 + 暖橙金（科技 / 男性化）
  [params.color]
    primary = '#0ea5e9'      # 深海蓝 — 主色调
    secondary = '#f59e0b'    # 暖橙金 — 强调色
    background = '#0a0e1a'   # 深空蓝黑背景
    accent = '#38bdf8'       # 亮蓝强调色
  # 暗色模式
  [params.dark_mode]
    button = true
    mode = 'auto'

  # 启用 AOS 动效
  [params.animation]
    enable = true
    options = { archive = { section = 'fade-up' } }

  # 版权声明
  # copyright = "© 2026 忆梦"


# Preloader (loader) loading text
[params.preloader.text]
  zh-CN = "加载中..."
  zh-TW = "加载中..."
  en = "Loading..."

# Inject custom HTML at specific body positions (M14: skip-link for a11y)
[params.injector]
  body_begin = '<a class="skip-link" href="#content">跳到主内容</a>'

# Mouse-firework 缩小范围：保留主题默认开关，但在 nav / header / footer / 卡片等
# 关键交互区不触发烟花，避免破坏导航/卡片点击的视觉反馈
[params.firework]
  enable = true
  disable_on_mobile = false
  options = { excludeelements = ['a', 'button', '#header', '#main-nav', '#sub-nav', '#i18n-nav', '#header-nav', '#footer', '.sidebar', '.skip-link', 'aside'] }