baseURL = 'https://www.zhangpengchao.com/'
locale = 'zh-CN'
title = '忆梦的博客'
theme = 'hugo-theme-reimu'
defaultContentLanguage = 'zh-CN'

# 中文为默认语言
[languages.zh-CN]
  title = '忆梦的博客'
  label = '简体中文'
  locale = 'zh-CN'
  weight = 1
  hasCJKLanguage = true

# 英文语言
[languages.en]
  title = "YiMeng's Blog"
  label = 'English'
  locale = 'en-US'
  weight = 2

[params]
  author = '忆梦'
  keyword = ['博客', '技术', '生活', 'Hugo', 'blog']
  description = '忆梦的个人博客，记录技术学习与生活感悟'
  since = 2026

  # 社交链接
  [params.social]
    github = 'https://github.com/YiMeng-Zpc'
    email = 'Yi.Meng-@outlook.com'

  # 顶部导航栏（name 用于 i18n 翻译）
  [[params.nav]]
    name = 'home'
    path = '/'
  [[params.nav]]
    name = 'archives'
    path = '/archives'
  [[params.nav]]
    name = 'tags'
    path = '/tags'
  [[params.nav]]
    name = 'categories'
    path = '/categories'
  [[params.nav]]
    name = 'about'
    path = '/about'

  # 侧边栏菜单（name 用于 i18n，url 用于链接）
  [[params.menu]]
    name = 'home'
    url = '/'
    icon = 'fa fa-home'
  [[params.menu]]
    name = 'archives'
    url = '/archives'
    icon = 'fa fa-archive'
  [[params.menu]]
    name = 'tags'
    url = '/tags'
    icon = 'fa fa-tags'
  [[params.menu]]
    name = 'categories'
    url = '/categories'
    icon = 'fa fa-folder'
  [[params.menu]]
    name = 'about'
    url = '/about'
    icon = 'fa fa-user'

  # 封面图配置（使用主题默认）
  [params.cover]
    image = '/images/cover.webp'
    blur = true
    opacity = 0.6

  # 页脚
  [params.footer]
    since = 2026
    author = '忆梦'
    custom = 'Powered by Hugo & Reimu Theme'

  # 搜索功能
  [params.search]
    enable = true

  # 侧边栏小组件
  [params.widget]
    enable = true
    description = '一个热爱技术的开发者，记录学习与成长的点滴。'

  # 自定义颜色（樱花粉主题色）
  [params.color]
    primary = '#ff7eb3'
    secondary = '#ff758c'
    background = '#fff5f5'

  # 版权声明
  # copyright = "© 2026 忆梦"
