name = "yi-meng-keystatic-admin"
main = ".open-next/worker.js"
compatibility_date = "2025-06-02"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NODE_ENV = "production"
# Keystatic GitHub OAuth — public client ID is safe to commit.
# Client ID is referenced at build time by the Keystatic handler.
KEYSTATIC_GITHUB_CLIENT_ID = "Ov23liRke9S4RSOwMTPR"

# Secrets (set via Cloudflare dashboard or `wrangler secret put`):
# - KEYSTATIC_GITHUB_CLIENT_SECRET
# - KEYSTATIC_SECRET
# The OAuth App callback must be:
# https://keystatic-admin.yi-meng.workers.dev/api/keystatic/github/oauth/callback
