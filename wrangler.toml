name = "yi-meng-keystatic-admin"
main = ".open-next/worker.js"
compatibility_date = "2025-06-02"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NODE_ENV = "production"
# GitHub OAuth App callback must be set to:
#   https://<your-worker-domain>/api/keystatic/github/oauth/callback
# Set the actual values in Cloudflare dashboard or via:
#   wrangler secret put KEYSTATIC_GITHUB_CLIENT_ID
#   wrangler secret put KEYSTATIC_GITHUB_CLIENT_SECRET
#   wrangler secret put KEYSTATIC_SECRET
# (Do NOT commit real secrets in this file.)