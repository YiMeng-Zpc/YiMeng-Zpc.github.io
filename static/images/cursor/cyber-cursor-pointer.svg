<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- 外层光晕（琥珀金） -->
  <path d="M3,2 L3,21 L8.5,16.2 L12.6,24.6 L15.4,23.4 L11.3,15 L18.5,15 Z"
        fill="#fbbf24" opacity="0.3" stroke="none"/>
  <!-- 主体：琥珀金霓虹箭头（与默认光标同形状，仅换色，避免悬停时"变成其他形状"） -->
  <path d="M3,2 L3,21 L8.5,16.2 L12.6,24.6 L15.4,23.4 L11.3,15 L18.5,15 Z"
        fill="url(#pg)" stroke="#fbbf24" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- 内芯高光 -->
  <path d="M5.2,4.2 L5.2,18.4 L9.4,14.8 L13.1,22.2 L14,21.8 L10.3,14.4 L16,14.4 Z"
        fill="#ffffff" opacity="0.55"/>
  <!-- 点击锁定环（虚线圆弧，提示可点击） -->
  <circle cx="10" cy="11" r="7.2" fill="none" stroke="#fbbf24" stroke-width="1.1"
          stroke-dasharray="2.6 2.6" opacity="0.85"/>
</svg>
