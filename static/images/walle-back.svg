<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
  <defs>
    <linearGradient id="walle-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- 履带（底部，同正面） -->
  <rect x="3" y="30" width="26" height="8" rx="4" fill="#374151" stroke="#1f2937" stroke-width="1"/>
  <circle cx="8" cy="34" r="3" fill="#6b7280" stroke="#374151" stroke-width="0.5"/>
  <circle cx="16" cy="34" r="3" fill="#6b7280" stroke="#374151" stroke-width="0.5"/>
  <circle cx="24" cy="34" r="3" fill="#6b7280" stroke="#374151" stroke-width="0.5"/>
  <line x1="5" y1="31" x2="27" y2="31" stroke="#4b5563" stroke-width="0.5"/>
  <line x1="5" y1="37" x2="27" y2="37" stroke="#4b5563" stroke-width="0.5"/>

  <!-- 身体（同正面，无胸前细节——改为散热格栅，看起来像背面） -->
  <rect x="5" y="14" width="22" height="16" rx="2" fill="url(#walle-back)" stroke="#b45309" stroke-width="0.8"/>
  <!-- 背面散热格栅（横条纹） -->
  <line x1="7" y1="18" x2="25" y2="18" stroke="#92400e" stroke-width="1" opacity="0.6"/>
  <line x1="7" y1="21" x2="25" y2="21" stroke="#92400e" stroke-width="1" opacity="0.6"/>
  <line x1="7" y1="24" x2="25" y2="24" stroke="#92400e" stroke-width="1" opacity="0.6"/>
  <line x1="7" y1="27" x2="25" y2="27" stroke="#92400e" stroke-width="1" opacity="0.6"/>
  <!-- 螺丝钉 -->
  <circle cx="7" cy="16" r="0.8" fill="#92400e"/>
  <circle cx="25" cy="16" r="0.8" fill="#92400e"/>
  <circle cx="7" cy="28" r="0.8" fill="#92400e"/>
  <circle cx="25" cy="28" r="0.8" fill="#92400e"/>

  <!-- 脖子 -->
  <rect x="13" y="10" width="6" height="5" fill="#92400e" stroke="#78350f" stroke-width="0.5"/>

  <!-- 头（无眼睛——背面只有光秃秃的黄色壳 + 一条天线条） -->
  <path d="M7,2 L25,2 L23,10 L9,10 Z" fill="url(#walle-back)" stroke="#b45309" stroke-width="0.8"/>
  <!-- 天线条 -->
  <rect x="15" y="0" width="2.5" height="3.5" rx="0.8" fill="#fbbf24" stroke="#b45309" stroke-width="0.5"/>
  <!-- 头部背面凹槽 -->
  <rect x="12" y="4" width="8" height="2.5" rx="1" fill="#92400e" opacity="0.45"/>
  <!-- 铆钉 -->
  <circle cx="9" cy="4.2" r="0.8" fill="#92400e"/>
  <circle cx="23" cy="4.2" r="0.8" fill="#92400e"/>
</svg>