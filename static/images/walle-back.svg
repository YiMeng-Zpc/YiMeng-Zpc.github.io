<svg xmlns="http://www.w3.org/2000/svg" width="36" height="48" viewBox="0 0 36 48">
  <defs>
    <linearGradient id="wBodyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fde68a"/>
      <stop offset="0.35" stop-color="#fbbf24"/>
      <stop offset="0.7"  stop-color="#f59e0b"/>
      <stop offset="1"   stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="wBodyShineB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.3"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wTreadB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#4b5563"/>
      <stop offset="0.5" stop-color="#1f2937"/>
      <stop offset="1"   stop-color="#374151"/>
    </linearGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="18" cy="46" rx="13" ry="2.2" fill="#000" opacity="0.25"/>

  <!-- 履带 -->
  <rect x="2" y="36" width="32" height="10" rx="5" fill="url(#wTreadB)" stroke="#111827" stroke-width="0.8"/>
  <circle cx="8"  cy="41" r="3.5" fill="#6b7280" stroke="#1f2937" stroke-width="0.6"/>
  <circle cx="8"  cy="41" r="1.8" fill="#374151" stroke="#6b7280" stroke-width="0.3"/>
  <circle cx="8"  cy="41" r="0.6" fill="#9ca3af"/>
  <circle cx="18" cy="41" r="3.5" fill="#6b7280" stroke="#1f2937" stroke-width="0.6"/>
  <circle cx="18" cy="41" r="1.8" fill="#374151" stroke="#6b7280" stroke-width="0.3"/>
  <circle cx="18" cy="41" r="0.6" fill="#9ca3af"/>
  <circle cx="28" cy="41" r="3.5" fill="#6b7280" stroke="#1f2937" stroke-width="0.6"/>
  <circle cx="28" cy="41" r="1.8" fill="#374151" stroke="#6b7280" stroke-width="0.3"/>
  <circle cx="28" cy="41" r="0.6" fill="#9ca3af"/>
  <line x1="4" y1="37" x2="32" y2="37" stroke="#52525b" stroke-width="0.4"/>
  <line x1="4" y1="45" x2="32" y2="45" stroke="#52525b" stroke-width="0.4"/>

  <!-- 身体（背面：散热格栅，无屏幕） -->
  <rect x="4" y="16" width="28" height="20" rx="2.5" fill="url(#wBodyB)" stroke="#92400e" stroke-width="0.9"/>
  <rect x="4" y="16" width="28" height="20" rx="2.5" fill="url(#wBodyShineB)"/>
  <!-- 背面散热格栅 -->
  <line x1="7" y1="20" x2="29" y2="20" stroke="#92400e" stroke-width="1" opacity="0.5"/>
  <line x1="7" y1="23" x2="29" y2="23" stroke="#92400e" stroke-width="1" opacity="0.5"/>
  <line x1="7" y1="26" x2="29" y2="26" stroke="#92400e" stroke-width="1" opacity="0.5"/>
  <line x1="7" y1="29" x2="29" y2="29" stroke="#92400e" stroke-width="1" opacity="0.5"/>
  <line x1="7" y1="32" x2="29" y2="32" stroke="#92400e" stroke-width="1" opacity="0.5"/>
  <!-- 背面警示灯 -->
  <circle cx="25" cy="18.5" r="1.2" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.3"/>
  <circle cx="25" cy="18.5" r="0.6" fill="#fca5a5" opacity="0.8"/>
  <!-- 螺丝钉 -->
  <circle cx="6"  cy="18" r="0.9" fill="#92400e" stroke="#78350f" stroke-width="0.3"/>
  <circle cx="6"  cy="18" r="0.3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="30" cy="18" r="0.9" fill="#92400e" stroke="#78350f" stroke-width="0.3"/>
  <circle cx="30" cy="18" r="0.3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="6"  cy="34" r="0.9" fill="#92400e" stroke="#78350f" stroke-width="0.3"/>
  <circle cx="30" cy="34" r="0.9" fill="#92400e" stroke="#78350f" stroke-width="0.3"/>

  <!-- 脖子 -->
  <rect x="14" y="11" width="8" height="6" fill="#92400e" stroke="#78350f" stroke-width="0.5"/>
  <line x1="16" y1="11" x2="16" y2="17" stroke="#78350f" stroke-width="0.3" opacity="0.5"/>
  <line x1="20" y1="11" x2="20" y2="17" stroke="#78350f" stroke-width="0.3" opacity="0.5"/>

  <!-- 头（背面：无眼睛，天线 + 检修面板） -->
  <path d="M6,2 L30,2 L27,11 L9,11 Z" fill="url(#wBodyB)" stroke="#92400e" stroke-width="0.9"/>
  <path d="M6,2 L30,2 L27,11 L9,11 Z" fill="url(#wBodyShineB)"/>
  <!-- 天线 -->
  <rect x="17" y="0" width="2" height="3" rx="0.6" fill="#fbbf24" stroke="#92400e" stroke-width="0.4"/>
  <circle cx="18" cy="0.5" r="1.2" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.3"/>
  <circle cx="18" cy="0.5" r="0.5" fill="#fca5a5"/>
  <!-- 检修面板 -->
  <rect x="12" y="4" width="12" height="4" rx="1" fill="#92400e" opacity="0.4" stroke="#78350f" stroke-width="0.3"/>
  <line x1="14" y1="5" x2="22" y2="5" stroke="#78350f" stroke-width="0.3"/>
  <line x1="14" y1="6" x2="22" y2="6" stroke="#78350f" stroke-width="0.3"/>
  <line x1="14" y1="7" x2="22" y2="7" stroke="#78350f" stroke-width="0.3"/>
  <!-- 铆钉 -->
  <circle cx="8"  cy="4" r="0.7" fill="#92400e" stroke="#78350f" stroke-width="0.3"/>
  <circle cx="28" cy="4" r="0.7" fill="#92400e" stroke="#78350f" stroke-width="0.3"/>
</svg>
