backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

i18n:
  structure: multiple_files
  locales:
    - code: zh-CN
      name: 简体中文
      default: true
    - code: en
      name: English

collections:
  - name: "posts"
    label: "📝 文章管理"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    i18n: true
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
        i18n: true
      - label: "发布时间"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        i18n: false
      - label: "分类"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - "技术"
          - "生活"
          - "随笔"
          - "教程"
        default: ["技术"]
        i18n: true
      - label: "标签"
        name: "tags"
        widget: "list"
        i18n: true
      - label: "封面图"
        name: "cover"
        widget: "image"
        required: false
        i18n: false
      - label: "摘要"
        name: "description"
        widget: "text"
        required: false
        i18n: true
      - label: "正文"
        name: "body"
        widget: "markdown"
        i18n: true
      - label: "草稿"
        name: "draft"
        widget: "boolean"
        default: true
        i18n: false

  - name: "about"
    label: "👤 关于页面"
    file: "content/about.md"
    i18n: true
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
        i18n: true
      - label: "正文"
        name: "body"
        widget: "markdown"
        i18n: true
